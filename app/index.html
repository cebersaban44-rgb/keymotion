<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Keymotion</title>
    <script src="/theme-boot.js"></script>
    <!--
      Launch animation, in the style of the keyboard's screen animation
      (chosen 2026-11-12): the logo's "K" drawn stroke by stroke, the
      orange stroke lights up, the wordmark opens. It is here, not in the
      app's code, so it plays from the first frame the window shows;
      src/lib/intro.ts ends it once the app is ready, moving the logo to
      the sidebar's.
    -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0e10;
        --intro-ink: #ece9e3;
        --intro-signal: #ff8a3d;
        --intro-edge: #2a2d33;
      }
      :root[data-theme="light"] #intro {
        background: #ebe9e4;
        --intro-ink: #16171a;
        --intro-signal: #d65f12;
        --intro-edge: transparent;
      }
      #intro .intro-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        will-change: transform;
      }
      #intro svg {
        width: 104px;
        height: 104px;
        overflow: visible;
      }
      #intro .intro-tile {
        fill: #16181c;
        stroke: var(--intro-edge);
        stroke-width: 2;
        transform-origin: 50px 50px;
        animation: intro-tile 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      #intro path {
        fill: none;
        stroke-width: 13;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: intro-draw var(--d) cubic-bezier(0.2, 0.7, 0.2, 1) var(--at) both;
      }
      #intro .intro-s1 { stroke: #ece9e3; --at: 120ms; --d: 260ms; }
      #intro .intro-s2 { stroke: #ece9e3; --at: 300ms; --d: 220ms; }
      #intro .intro-s3 {
        stroke: #ff8a3d;
        --at: 470ms;
        --d: 240ms;
        animation:
          intro-draw 240ms cubic-bezier(0.2, 0.7, 0.2, 1) 470ms both,
          intro-light 300ms ease-out 700ms both;
      }
      #intro .intro-word {
        display: flex;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: var(--intro-ink);
      }
      #intro .intro-word span {
        display: inline-block;
        animation: intro-letter 200ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
        animation-delay: calc(560ms + var(--i) * 35ms);
      }
      #intro .intro-word .m { color: var(--intro-signal); }
      @keyframes intro-tile {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes intro-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes intro-light {
        50% { stroke: #ffd2b0; }
      }
      @keyframes intro-letter {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      /* Windows' animation effects off: the logo and the name, no motion. */
      @media (prefers-reduced-motion: reduce) {
        #intro *, #intro path { animation: none !important; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-stage">
        <svg viewBox="0 0 100 100">
          <rect class="intro-tile" width="100" height="100" rx="22" />
          <path class="intro-s1" pathLength="1" d="M34 25V75" />
          <path class="intro-s2" pathLength="1" d="M46 51L68 27" />
          <path class="intro-s3" pathLength="1" d="M51 57L69 75" />
        </svg>
        <div class="intro-word">
          <span style="--i: 0">k</span><span style="--i: 1">e</span><span style="--i: 2">y</span><span class="m" style="--i: 3">m</span><span class="m" style="--i: 4">o</span><span class="m" style="--i: 5">t</span><span class="m" style="--i: 6">i</span><span class="m" style="--i: 7">o</span><span class="m" style="--i: 8">n</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
