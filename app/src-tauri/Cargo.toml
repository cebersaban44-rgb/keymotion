[package]
name = "keymotion"
description = "Keymotion — desktop control app for keyboards with lights and a screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "keymotion_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
jiff.workspace = true
kb-agent.workspace = true
kb-hooks.workspace = true
kb-core.workspace = true
kb-devices.workspace = true
kb-protocol.workspace = true
kb-transport.workspace = true
kb-winsys.workspace = true
realfft = "3.5"
semver = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = "12"

[features]
# A simulated AK980 PRO on firmware 769 (`KEYMOTION_SIM=aa769`, sim.rs), for
# developing the "AA" family without one. Debug builds only: a release build
# with it does not compile (lib.rs), and no release script turns it on.
sim = ["kb-core/sim"]

[dev-dependencies]
gif.workspace = true
# The app's tests drive the "AA" arm against the simulated keyboard.
kb-core = { workspace = true, features = ["sim"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Security_Cryptography_Certificates",
    "UI_Notifications",
    "Web_Http",
    "Web_Http_Filters",
    "Web_Http_Headers",
] }
windows-version = "0.100"

[lints]
workspace = true
