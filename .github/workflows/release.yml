# Builds the Windows installer and puts it on a DRAFT GitHub release, with the
# files the app's updater reads.
#
#   - Pushing a `v*` tag builds that version. The tag must be "v" + the
#     version in the app's files (tools/check-version.mjs), and CHANGELOG.md
#     must have a section for it ("## [0.2.0] - <date>").
#   - "Run workflow" on a branch makes a test build of the version in
#     app/src-tauri/tauri.conf.json; when CHANGELOG.md has no section for it
#     yet, the notes come from "## [Unreleased]". Delete such a test draft
#     rather than publishing it: publishing creates the tag on that commit.
#
# The release files are only ever built here, never uploaded from a computer:
# SignPath (stage 9) asks for automated builds that can be traced to the
# source. Nothing is published: the owner reviews the draft and publishes it.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (required, the updater key from
# `pnpm --dir app tauri signer generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (that key's password; leave it unset or empty when it has none).
#
# Actions are pinned to commit SHAs (the release is in the comment next to
# each), as in ci.yml; Dependabot proposes updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# actions: read lets a job read its own run's artifacts and details, which
# SignPath's action needs when signing is turned on (stage 9).
permissions:
  contents: write
  actions: read

# One release build per tag or branch at a time. A second one waits rather than
# cancelling a build that may be uploading.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Publishing a draft made from a branch ("Run workflow") creates its tag,
  # and the tag starts this workflow again. That release is already out, so
  # there is nothing to build: the run ends here, green (release test,
  # 2026-11-12: it failed instead, as the tag had no CHANGELOG section).
  published:
    name: Is the tag's release already published?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          skip=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [ "$draft" = false ]; then
              skip=true
              echo "Release $GITHUB_REF_NAME is already published (its draft made the tag): nothing to build." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  release:
    name: Build and draft the release
    needs: published
    if: needs.published.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      # The whole history, so the release check below can see main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # A release is built only from code that is on main: a tag on any other
      # commit stops here. Test builds from a branch ("Run workflow") skip this.
      - name: The tag is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Tag the release merge on main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is on main."

      # The cheap checks run first, so a wrong tag or a missing secret fails
      # in seconds instead of after the build.
      - name: Check the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node tools/check-version.mjs --tag "$GITHUB_REF_NAME" --github-output
          else
            node tools/check-version.mjs --github-output
          fi

      # A tag needs its own CHANGELOG.md section; a test build from a branch
      # may use the Unreleased one.
      - name: Check the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node tools/release/latest-json.mjs --check-notes --version "$VERSION"
          else
            node tools/release/latest-json.mjs --check-notes --version "$VERSION" --allow-unreleased
          fi

      - name: Check the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is missing or empty. Add the updater's private key (made with 'pnpm --dir app tauri signer generate') under Settings > Secrets and variables > Actions; without it the build cannot sign the update."
            exit 1
          fi

      - name: Release script tests
        run: node --test "tools/release/*.test.mjs"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          # A release (tag) builds from scratch, without caches, so nothing in
          # it comes from an earlier run. Test builds from a branch may cache.
          cache: ${{ github.ref_type != 'tag' }}
          cache_dependency_path: app/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir app install --frozen-lockfile

      # The release is pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal -c rustfmt -c clippy --no-self-update
          rustc --version

      # Only test builds from a branch use the Rust cache. A release (tag)
      # compiles everything from source, so nothing in it comes from an
      # earlier run (SignPath checks how a signed file was built).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag'

      # With bundle.createUpdaterArtifacts, tauri build also signs the setup
      # .exe for the updater (<setup>.exe.sig) with the key below. Old bundles
      # are removed first, so the next step finds only this build's files.
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rm -rf target/release/bundle app/src-tauri/target/release/bundle
          pnpm --dir app tauri build --bundles nsis

      # The repository is a Cargo workspace, so target/ is at the root; the
      # app's own folder is searched too in case that ever changes.
      - name: Find the installer
        id: setup
        run: |
          shopt -s nullglob
          found=(target/release/bundle/nsis/*-setup.exe app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one NSIS setup .exe, found ${#found[@]}: ${found[*]}"
            exit 1
          fi
          setup="${found[0]}"
          if [ ! -s "$setup.sig" ]; then
            echo "::error::$setup.sig is missing. Is bundle.createUpdaterArtifacts true in app/src-tauri/tauri.conf.json?"
            exit 1
          fi
          mkdir -p release-out
          cp "$setup" "$setup.sig" release-out/
          name="$(basename "$setup")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Installer: $setup"

      # --- Code signing (stage 9, SignPath Foundation): not active yet --------
      # Turned on once SignPath accepts the project and gives its ids. Plan
      # (keymotion-notes: signpath-denetim.md has the details):
      #
      # - Only tag builds sign (`if: github.ref_type == 'tag'`). Test builds
      #   from a branch stay unsigned, so the release certificate never signs
      #   a test version.
      # - SignPath can't open NSIS installers, so there are two requests, each
      #   approved by the owner in SignPath:
      #     1. `tauri build --no-bundle`, upload `keymotion.exe`, sign it
      #        (signpath/github-action-submit-signing-request, pinned by SHA,
      #        with wait-for-completion-timeout-in-seconds: 3600), and put the
      #        signed file back in target/release;
      #     2. `tauri bundle --bundles nsis`, upload the installer, sign it.
      # - Then the updater signature, made over the SIGNED installer, because
      #   signing changes the file's bytes and the .sig tauri wrote earlier
      #   no longer matches:
      #       rm "release-out/$SETUP.sig"
      #       pnpm --dir app tauri signer sign --app-version "$VERSION" "../release-out/$SETUP"
      #       test -s "release-out/$SETUP.sig"
      #   Nothing may change the installer after this.
      # - Check both signatures (Get-AuthenticodeSignature: Valid, signer
      #   "SignPath Foundation"; the exe is taken out of the installer with 7z).
      # - The steps below then read the signed file: SHA-256, latest.json and
      #   the notes, with `--signed` so the release text drops the "not signed
      #   yet" note.
      # - The job's timeout-minutes goes up (about 180) so waiting for the two
      #   approvals doesn't end the job.
      # ---------------------------------------------------------------------------

      - name: SHA-256 of the installer
        id: sha256
        env:
          SETUP: ${{ steps.setup.outputs.name }}
        run: |
          sha256="$(sha256sum "release-out/$SETUP" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SHA-256 of $SETUP: $sha256"

      # As in "Check the release notes": only a branch build may use Unreleased.
      - name: Write latest.json and the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SETUP: ${{ steps.setup.outputs.name }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          args=(--version "$VERSION" --setup "release-out/$SETUP" --sha256 "$SHA256")
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            args+=(--allow-unreleased)
          fi
          node tools/release/latest-json.mjs "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keymotion-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release-out/${{ steps.setup.outputs.name }}
            release-out/${{ steps.setup.outputs.name }}.sig
            release-out/latest.json
          if-no-files-found: error
          overwrite: true

      # Creates the draft, or refreshes it when this is a re-run. A release
      # that is already published is never touched.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SETUP: ${{ steps.setup.outputs.name }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          tag="v$VERSION"
          title="Keymotion $VERSION"
          files=("release-out/$SETUP" "release-out/$SETUP.sig" release-out/latest.json)
          case "$VERSION" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::Release $tag is already published. This workflow only makes drafts; raise the version for a new release."
              exit 1
            fi
            echo "Draft $tag exists (a re-run): updating its notes and replacing its files."
            gh release edit "$tag" --draft --title "$title" --notes-file release-out/release-notes.md \
              --target "$GITHUB_SHA" --prerelease="$prerelease"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            flags=()
            if [ "$prerelease" = true ]; then
              flags+=(--prerelease)
            fi
            gh release create "$tag" --draft --title "$title" --notes-file release-out/release-notes.md \
              --target "$GITHUB_SHA" "${flags[@]}" "${files[@]}"
          fi

          url="$(gh release view "$tag" --json url --jq .url)"
          {
            echo "### $title (draft)"
            echo
            echo "- Draft: $url"
            echo "- Installer: \`$SETUP\`"
            echo "- SHA-256: \`$SHA256\`"
            echo "- Pre-release: $prerelease"
          } >> "$GITHUB_STEP_SUMMARY"
