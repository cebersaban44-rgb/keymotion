# Publishes a release once the Microsoft Store has certified it (docs site:
# developers/microsoft-store, "Making a release").
#
#   Actions › Publish a release › Run workflow, with "Use workflow from" set
#   to the release tag (Tags › v1.2.0) and the same tag typed below: the
#   microsoft-store environment only lets v* tags use its secrets.
#
#   1. Reads the status of the tag's Store submission (tools/store/submit.mjs
#      --status). Only reading: nothing in the Store changes.
#   2. Unless "Only check" is ticked, and only when the submission has passed
#      certification (Release, or already Publishing or Published), publishes
#      the tag's GitHub draft release (release.yml made it).
#   3. The Store's copy is published by selecting "Publish now" in Partner
#      Center: the submission API has no way to do it.
#
# A pre-release (v1.3.0-beta.1; docs site: developers/contributing, "Beta
# (pre-release)") is only on GitHub: the Store is not asked, and its draft is
# published as a pre-release, never as GitHub's latest release. The app's
# updater on normal installs reads the latest release only, so the run then
# checks that GitHub's latest release is still a normal one, and fails
# loudly if it is not.
#
# Actions are pinned to commit SHAs (the release is in the comment next to
# each), as in ci.yml; Dependabot proposes updates.
name: Publish a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.2.0 or v1.3.0-beta.1 (run the workflow from this tag)
        required: true
        type: string
      check_only:
        description: Only check (the Store's status; for a pre-release, its draft); publish nothing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tag:
    name: Release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Run from the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            prerelease=true
          else
            echo "::error::$TAG is not a release tag such as v1.2.0, or a pre-release tag such as v1.3.0-beta.1."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is from $GITHUB_REF. Run it again with \"Use workflow from\" set to Tags › $TAG."
            exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  store:
    name: Store submission status
    needs: tag
    if: needs.tag.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: microsoft-store
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read the status
        id: status
        env:
          TAG: ${{ inputs.tag }}
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: node tools/store/submit.mjs --status --tag "$TAG"

  github:
    name: Publish the GitHub release
    needs: store
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          STATUS: ${{ needs.store.outputs.status }}
        run: |
          case "$STATUS" in
            Release | Publishing | Published) ;;
            *)
              echo "::error::The Store submission of $TAG is $STATUS, not certified yet: the GitHub draft stays a draft. Run this again when the Store says it passed (status Release)."
              exit 1
              ;;
          esac

          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "::error::There is no GitHub release $TAG. release.yml makes its draft when the tag is pushed."
            exit 1
          fi
          if [ "$draft" = true ]; then
            gh release edit "$TAG" --draft=false --latest
            echo "Published the GitHub release $TAG."
          else
            echo "The GitHub release $TAG was already published."
          fi

          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### $TAG is published on GitHub"
            echo
            echo "- GitHub release: $url"
            if [ "$STATUS" = Release ]; then
              echo "- Microsoft Store: certified and waiting. **Now select \"Publish now\" in Partner Center › Keymotion**; the API can't."
            else
              echo "- Microsoft Store: $STATUS."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = Release ]; then
            echo "::notice::Now select \"Publish now\" in Partner Center › Keymotion, so the Store's copy comes out too."
          fi

  # A pre-release: no Store, and never GitHub's latest release. "Only check"
  # publishes nothing and only runs the check of the latest release.
  prerelease:
    name: Publish the GitHub pre-release
    needs: tag
    if: needs.tag.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the draft as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "::error::There is no GitHub release $TAG. release.yml makes its draft when the tag is pushed."
            exit 1
          fi
          if [ "$CHECK_ONLY" = true ]; then
            echo "Only check: $TAG is $([ "$draft" = true ] && echo "a draft" || echo "published"); nothing was changed."
          elif [ "$draft" = true ]; then
            # One change: published, a pre-release, and not the latest release.
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            echo "Published the GitHub pre-release $TAG."
          else
            echo "The GitHub release $TAG was already published."
          fi

          prerelease="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" != true ]; then
            echo "::error::GitHub release $TAG is not marked as a pre-release, so normal installs may update to it. Mark it now: gh release edit $TAG --prerelease --latest=false"
            exit 1
          fi

      # The app's updater on normal installs reads the latest release's
      # latest.json: it must still be a normal release, never this one.
      - name: GitHub's latest release is still a normal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! latest="$(gh release view --json tagName,isPrerelease --jq '"\(.tagName) \(.isPrerelease)"')"; then
            echo "::error::GitHub has no latest release: normal installs find no update. Mark the newest normal release as the latest: gh release edit <tag> --latest"
            exit 1
          fi
          read -r latest_tag latest_prerelease <<< "$latest"
          if [ "$latest_tag" = "$TAG" ] || [ "$latest_prerelease" != false ] || ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GitHub's latest release is $latest_tag (pre-release: $latest_prerelease), not a normal release: normal installs would update to it. Mark $TAG as a pre-release (gh release edit $TAG --prerelease --latest=false) and the newest normal release as the latest (gh release edit <tag> --latest)."
            exit 1
          fi
          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### Pre-release $TAG"
            echo
            echo "- GitHub release: $url"
            echo "- GitHub's latest release, which normal installs update to, is still $latest_tag."
            echo "- Microsoft Store: pre-releases are not sent there."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub's latest release is still $latest_tag."
