# Publishes a release's GitHub draft once its install test has passed (docs
# site: developers/microsoft-store, "Making a release").
#
#   Actions › Publish a release › Run workflow, with "Use workflow from" set
#   to the release tag (Tags › v1.3.0) and the same tag typed below: the
#   microsoft-store environment only lets v* tags use its secrets.
#
#   1. Checks that the tag's Release run (release.yml) passed its install
#      test on a clean Windows. Only reading.
#   2. Unless "Only check" is ticked, publishes the tag's GitHub draft
#      (release.yml made it) as GitHub's latest release.
#   3. Shows the status of the tag's Store submission (tools/store/submit.mjs
#      --status). Only reading, and nothing waits for it: GitHub comes first
#      (owner's decision, 2026-11-25), and the Store publishes its copy by
#      itself once Microsoft certifies it, usually within a day.
#
# A pre-release (v1.3.0-beta.1; docs site: developers/contributing, "Beta
# (pre-release)") is only on GitHub: the Store is not asked, and its draft is
# published as a pre-release, never as GitHub's latest release. The app's
# updater on normal installs reads the latest release only, so the run then
# checks that GitHub's latest release is still a normal one, and fails
# loudly if it is not.
#
# Actions are pinned to commit SHAs (the release is in the comment next to
# each), as in ci.yml; Dependabot proposes updates.
name: Publish a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.3.0 or v1.3.0-beta.1 (run the workflow from this tag)
        required: true
        type: string
      check_only:
        description: Only check (the install test; for a release, the Store's status); publish nothing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tag:
    name: Release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Run from the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            prerelease=true
          else
            echo "::error::$TAG is not a release tag such as v1.3.0, or a pre-release tag such as v1.3.0-beta.1."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is from $GITHUB_REF. Run it again with \"Use workflow from\" set to Tags › $TAG."
            exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # The installer on the draft was tried on a clean Windows by the tag's own
  # Release run (release.yml, "Install test on a clean Windows"). A draft is
  # published only once that job has passed on the tag's commit.
  tested:
    name: The install test passed
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: The tag's Release run passed its install test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          JOB: Install test on a clean Windows
        run: |
          # The newest Release run that pushing the tag started, on the tag's commit.
          if ! run="$(gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?event=push&branch=$TAG&head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.id) \(.html_url)"')"; then
            echo "::error::Could not read the Release runs of $TAG."
            exit 1
          fi
          if [ -z "$run" ]; then
            echo "::error::No Release run (release.yml) started by pushing $TAG on $GITHUB_SHA: the draft has had no install test."
            exit 1
          fi
          read -r id url <<< "$run"

          # The job's latest attempt: "completed success", "in_progress null", ...
          if ! job="$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
            --jq "[.jobs[] | select(.name == \"$JOB\")][0] // empty | \"\(.status) \(.conclusion)\"")"; then
            echo "::error::Could not read the jobs of the Release run $url."
            exit 1
          fi
          case "$job" in
            "completed success")
              echo "The install test of $TAG passed: $url"
              ;;
            "")
              echo "::error::The Release run of $TAG has no \"$JOB\" job (yet): $url"
              exit 1
              ;;
            completed*)
              echo "::error::The install test of $TAG did not pass (${job#completed }): the draft stays a draft. See $url; re-run the job if it was the runner, otherwise fix it in a new version."
              exit 1
              ;;
            *)
              echo "::error::The install test of $TAG is still running (${job%% *}): run this again when it has passed. $url"
              exit 1
              ;;
          esac
          {
            echo "### $TAG passed its install test"
            echo
            echo "- Release run: $url"
          } >> "$GITHUB_STEP_SUMMARY"

  # Only reading, and only to show where the Store's copy is: it publishes
  # by itself when Microsoft certifies it, and nothing here waits for it.
  # Without the Store secrets it says that the Store was not asked.
  store:
    name: Store submission status
    needs: tag
    if: needs.tag.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: microsoft-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read the status
        env:
          TAG: ${{ inputs.tag }}
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: node tools/store/submit.mjs --status --tag "$TAG"

  github:
    name: Publish the GitHub release
    needs: [tag, tested]
    if: needs.tag.outputs.prerelease == 'false' && !inputs.check_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "::error::There is no GitHub release $TAG. release.yml makes its draft when the tag is pushed."
            exit 1
          fi
          if [ "$draft" = true ]; then
            gh release edit "$TAG" --draft=false --latest
            echo "Published the GitHub release $TAG."
          else
            echo "The GitHub release $TAG was already published."
          fi

          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### $TAG is published on GitHub"
            echo
            echo "- GitHub release: $url"
            echo "- Microsoft Store: its copy publishes by itself once Microsoft has certified it, usually within a day. **Store submission status** in this run shows where it is."
          } >> "$GITHUB_STEP_SUMMARY"

  # A pre-release: no Store, and never GitHub's latest release. "Only check"
  # publishes nothing and only runs the checks.
  prerelease:
    name: Publish the GitHub pre-release
    needs: [tag, tested]
    if: needs.tag.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the draft as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "::error::There is no GitHub release $TAG. release.yml makes its draft when the tag is pushed."
            exit 1
          fi
          if [ "$CHECK_ONLY" = true ]; then
            echo "Only check: $TAG is $([ "$draft" = true ] && echo "a draft" || echo "published"); nothing was changed."
          elif [ "$draft" = true ]; then
            # One change: published, a pre-release, and not the latest release.
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            echo "Published the GitHub pre-release $TAG."
          else
            echo "The GitHub release $TAG was already published."
          fi

          prerelease="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" != true ]; then
            echo "::error::GitHub release $TAG is not marked as a pre-release, so normal installs may update to it. Mark it now: gh release edit $TAG --prerelease --latest=false"
            exit 1
          fi

      # The app's updater on normal installs reads the latest release's
      # latest.json: it must still be a normal release, never this one.
      - name: GitHub's latest release is still a normal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! latest="$(gh release view --json tagName,isPrerelease --jq '"\(.tagName) \(.isPrerelease)"')"; then
            echo "::error::GitHub has no latest release: normal installs find no update. Mark the newest normal release as the latest: gh release edit <tag> --latest"
            exit 1
          fi
          read -r latest_tag latest_prerelease <<< "$latest"
          if [ "$latest_tag" = "$TAG" ] || [ "$latest_prerelease" != false ] || ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GitHub's latest release is $latest_tag (pre-release: $latest_prerelease), not a normal release: normal installs would update to it. Mark $TAG as a pre-release (gh release edit $TAG --prerelease --latest=false) and the newest normal release as the latest (gh release edit <tag> --latest)."
            exit 1
          fi
          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### Pre-release $TAG"
            echo
            echo "- GitHub release: $url"
            echo "- GitHub's latest release, which normal installs update to, is still $latest_tag."
            echo "- Microsoft Store: pre-releases are not sent there."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub's latest release is still $latest_tag."
