[package]
name = "keymotion-cli"
description = "The command-line tool AI coding agents and scripts use to light the keyboard's keys through the running Keymotion app. It talks to the app over kb-agent's named pipe and never opens the keyboard itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "keymotion-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kb-agent.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
kb-winsys.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
