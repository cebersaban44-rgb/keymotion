# AJAZZ AK980 PRO — ekranlı üç modlu sürüm.
# `verified = true` yalnızca bu projede gerçek cihazda ölçülen bilgiler içindir.
# Kaynaklar: docs/teknik-analiz.md, docs/research/

id = "ajazz-ak980-pro"
name = "AJAZZ AK980 PRO"
vendor = "AJAZZ"
protocol = "sonix-ff13"
layout = "98"
key_count = 97
has_knob = true
has_side_light = true

[screen]
width = 240
height = 135
pixel_format = "rgb565-le"
verified = false

# Verified 2026-11-10 on fw 0x0106: IDs, product "AK980 PRO", FF13/FF68
# interfaces, F5 read-back and the 04 20 real-time stream (docs/donanim-dogrulama.md).
[[modes]]
kind = "usb"
vid = 0x0C45
pid = 0x8009
product_contains = "AK980"
command_usage_page = 0xFF13
display_usage_page = 0xFF68
capabilities = ["lighting", "per-key-rgb", "keymap", "macros", "options", "screen", "clock"]
verified = true

[[modes]]
kind = "dongle"
vid = 0x0C45
pid = 0xFEFE
command_usage_page = 0xFF60
capabilities = ["lighting", "clock", "battery"]
verified = false

[[modes]]
kind = "bluetooth"
vid = 0x0C45
pid = 0xFEFE
ble_name_prefix = "AK980 PRO"
capabilities = ["battery"]
verified = true

# Firmware status lights. Read back with `04 F5` on 2026-11-10: Num Lock
# white (`FE FF FF`) while Num Lock is on, Fn red (`FE 00 00`) in every
# mode, both at full value whatever the brightness level. What the Fn light
# reports is still an open question (docs/DURUM.md §8).
[[indicators]]
led = 32
name = "Num Lock"
color = [255, 255, 255]
verified = true

[[indicators]]
led = 96
name = "Fn"
color = [255, 0, 0]
verified = true

# Physical geometry in key units (1u = one standard key).
